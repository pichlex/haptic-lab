<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Haptic Lab</title>
  <desc id="desc">Web controls with tactile detents on supported iPhones.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#2B2E35"/>
    </pattern>
  </defs>
  <rect width="1600" height="520" rx="36" fill="#0D0F12"/>
  <rect width="1600" height="520" rx="36" fill="url(#grid)"/>
  <rect x="112" y="120" width="280" height="280" rx="64" fill="#16191E" stroke="#30343C" stroke-width="2"/>
  <path d="M198 190v140M306 190v140" fill="none" stroke="#F7F4ED" stroke-width="36" stroke-linecap="round"/>
  <path d="M168 260h63l16-37 31 74 20-37h39" fill="none" stroke="#FF6846" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
