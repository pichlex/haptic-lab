<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Haptic Lab logo</title>
  <desc id="desc">A rounded H crossed by a tactile waveform inside a glowing ring.</desc>
  <defs>
    <linearGradient id="ring" x1="78" y1="62" x2="438" y2="452" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9B8CFF"/>
      <stop offset=".48" stop-color="#5D8DFF"/>
      <stop offset="1" stop-color="#65E5F1"/>
    </linearGradient>
    <linearGradient id="mark" x1="146" y1="134" x2="374" y2="382" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".36" stop-color="#DCD6FF"/>
      <stop offset=".72" stop-color="#82B8FF"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <radialGradient id="bg" cx="0" cy="0" r="1" gradientTransform="translate(178 142) rotate(48) scale(400)">
      <stop stop-color="#25223D"/>
      <stop offset=".52" stop-color="#11131C"/>
      <stop offset="1" stop-color="#090A0E"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000" flood-opacity=".42"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="13" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="224" fill="url(#bg)" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="218" fill="none" stroke="url(#ring)" stroke-width="12" opacity=".95"/>
  <circle cx="256" cy="256" r="192" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
  <g fill="url(#mark)">
    <rect x="142" y="132" width="72" height="248" rx="30"/>
    <rect x="298" y="132" width="72" height="248" rx="30"/>
  </g>
  <path d="M174 258h40c18 0 25-43 43-43 18 0 25 86 43 86 18 0 25-43 43-43h25" fill="none" stroke="url(#ring)" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M174 258h40c18 0 25-43 43-43 18 0 25 86 43 86 18 0 25-43 43-43h25" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
